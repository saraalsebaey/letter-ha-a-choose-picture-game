<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صياد حرف ح</title>
    <!-- تضمين خط تجوال -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
    <!-- مكتبة Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Tajawal', 'sans-serif'],
                    },
                    colors: {
                        happyPink: '#FF6699',
                        happyCyan: '#00E5FF',
                        happyYellow: '#FFEA00',
                        happyBlue: '#2979FF',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #E0F7FA; /* لون سماوي فاتح جداً للخلفية */
            background-image: radial-gradient(#84FFFF 3px, transparent 3px);
            background-size: 40px 40px;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* تنسيقات عامة للبطاقات والأزرار */
        .pop-in {
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .emoji-card {
            font-size: 110px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            border-radius: 2rem;
            box-shadow: 0 12px 0px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            aspect-ratio: 1;
            border: 8px solid transparent;
        }

        @media (max-width: 600px) {
            .emoji-card { font-size: 80px; border-radius: 1.5rem; }
        }

        .emoji-card:hover {
            transform: translateY(-10px) scale(1.05);
        }

        .emoji-card:active {
            transform: translateY(0) scale(0.95);
            box-shadow: 0 4px 0px rgba(0,0,0,0.1);
        }

        /* حركات الإجابة */
        .shake-animation {
            animation: shake 0.5s ease-in-out;
            border-color: #FF1744 !important; /* أحمر للإجابة الخاطئة */
            background-color: #ffebee;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-15px) rotate(-8deg); }
            50% { transform: translateX(15px) rotate(8deg); }
            75% { transform: translateX(-15px) rotate(-8deg); }
        }

        .correct-animation {
            border-color: #00E676 !important; /* أخضر للإجابة الصحيحة */
            background-color: #F1F8E9;
            transform: scale(1.1) translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 230, 118, 0.4);
            z-index: 10;
        }

        /* الأزرار الكبيرة */
        .big-btn {
            box-shadow: 0 8px 0px rgba(0,0,0,0.2);
            transition: all 0.1s;
        }
        .big-btn:active {
            box-shadow: 0 0px 0px rgba(0,0,0,0.2);
            transform: translateY(8px);
        }

        /* النجوم المتساقطة */
        .star {
            position: fixed;
            font-size: 3rem;
            pointer-events: none;
            z-index: 50;
        }

        /* زر الصوت */
        .audio-btn {
            transition: transform 0.2s;
        }
        .audio-btn:active {
            transform: scale(0.8) rotate(-15deg);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 font-sans text-gray-800 relative">

    <!-- 1. شاشة البداية -->
    <div id="start-screen" class="flex flex-col items-center justify-center text-center pop-in z-20 w-full max-w-2xl bg-white p-10 md:p-16 rounded-[3rem] shadow-2xl border-8 border-happyPink">
        <div class="text-8xl mb-6">🧸🎈</div>
        <h1 class="text-5xl md:text-7xl font-black text-happyPink mb-6 drop-shadow-md">
            صياد حرف ح
        </h1>
        <p class="text-3xl font-bold text-gray-600 mb-10">هل أنت مستعد للعب؟</p>
        <button onclick="startGame()" class="big-btn bg-happyYellow hover:bg-yellow-400 text-gray-800 text-4xl font-black py-6 px-16 rounded-[3rem] border-4 border-yellow-500 w-full md:w-auto flex items-center justify-center gap-4">
            <span>ابدأ اللعب</span>
            <span class="text-5xl">▶️</span>
        </button>
    </div>

    <!-- 2. حاوية اللعبة الرئيسية (مخفية في البداية) -->
    <div id="game-container" class="hidden w-full max-w-4xl flex-col items-center z-10">
        
        <!-- منطقة السؤال وزر إعادة الصوت -->
        <div class="text-center mb-8 pop-in w-full flex flex-col items-center">
            <div class="bg-white px-8 py-6 rounded-[2.5rem] shadow-xl border-4 border-happyCyan inline-flex items-center gap-6 max-w-full">
                <button onclick="replayAudio()" class="audio-btn bg-happyPink text-white p-4 rounded-full shadow-lg text-4xl border-4 border-pink-600 focus:outline-none shrink-0" aria-label="إعادة الاستماع">
                    🔊
                </button>
                <p class="text-3xl md:text-5xl font-extrabold text-gray-700 leading-tight">
                    أين <span id="target-word" class="text-happyBlue text-4xl md:text-6xl">---</span> ؟
                </p>
            </div>
        </div>

        <!-- منطقة البطاقات (الخيارات) -->
        <div id="options-container" class="grid grid-cols-3 gap-4 md:gap-8 w-full max-w-3xl mb-8">
            <!-- سيتم إضافة البطاقات هنا -->
        </div>

        <!-- منطقة الرسائل التفاعلية -->
        <div id="feedback-container" class="h-40 flex flex-col items-center justify-center w-full">
            <p id="feedback-msg" class="text-4xl md:text-5xl font-black mb-6 opacity-0 transition-opacity duration-300 drop-shadow-md"></p>
            
            <button id="next-btn" onclick="nextQuestion()" class="hidden big-btn bg-happyCyan hover:bg-cyan-400 text-gray-800 text-3xl font-black py-5 px-12 rounded-[2rem] border-4 border-cyan-600 flex items-center gap-3">
                <span>السؤال التالي</span>
                <span class="text-4xl">➡️</span>
            </button>
        </div>
    </div>

    <!-- 3. شاشة النهاية (مخفية) -->
    <div id="end-screen" class="hidden flex-col items-center justify-center text-center z-20 w-full max-w-2xl bg-white p-10 md:p-16 rounded-[3rem] shadow-2xl border-8 border-happyYellow">
        <div class="text-8xl mb-6">🎉🏆👑</div>
        <h2 class="text-6xl md:text-7xl font-black text-happyBlue mb-6">عمل رائع!</h2>
        <p class="text-4xl font-bold text-gray-600 mb-12">أنت بطل حرف الحاء!</p>
        <button onclick="resetToFirst()" class="big-btn bg-happyPink hover:bg-pink-500 text-white text-4xl font-black py-6 px-16 rounded-[3rem] border-4 border-pink-700 w-full md:w-auto flex items-center justify-center gap-4">
            <span>العب مرة أخرى</span>
            <span class="text-5xl">🔄</span>
        </button>
    </div>

    <!-- التذييل -->
    <footer class="w-full text-center py-4 text-gray-500 font-bold text-lg md:text-xl z-10 relative mt-auto">
        تصميم : أ/ سارة نبيل
    </footer>

    <script>
        // بيانات الأسئلة
        const gameData = [
            { word: 'حِصَان', spoken: 'أَيْنَ صُورَةُ حِصَان؟', correct: '🐎', distractors: ['🦁', '🍌'] },
            { word: 'حُوت', spoken: 'أَيْنَ صُورَةُ حُوت؟', correct: '🐳', distractors: ['🐟', '🍎'] },
            { word: 'حَلِيب', spoken: 'أَيْنَ صُورَةُ حَلِيب؟', correct: '🥛', distractors: ['🐈', '🚗'] },
            { word: 'حَدِيقَة', spoken: 'أَيْنَ صُورَةُ حَدِيقَة؟', correct: '🏞️', distractors: ['🍌', '🍎'] },
            { word: 'حِذَاء', spoken: 'أَيْنَ صُورَةُ حِذَاء؟', correct: '👞', distractors: ['🦁', '🐈'] },
            { word: 'حَمَامَة', spoken: 'أَيْنَ صُورَةُ حَمَامَة؟', correct: '🕊️', distractors: ['🚗', '🐟'] }
        ];

        let currentQuestionIndex = 0;
        let isAnswered = false;

        // عناصر DOM
        const startScreen = document.getElementById('start-screen');
        const gameContainer = document.getElementById('game-container');
        const endScreen = document.getElementById('end-screen');
        const optionsContainer = document.getElementById('options-container');
        const targetWordElement = document.getElementById('target-word');
        const feedbackMsg = document.getElementById('feedback-msg');
        const nextBtn = document.getElementById('next-btn');

        // ==== دالة النطق الصوتي (Web Speech API) ====
        function speakText(text) {
            // إيقاف أي صوت يعمل حالياً
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA'; // اللغة العربية
            utterance.rate = 0.95;    // سرعة أسرع قليلاً بناءً على طلبك
            utterance.pitch = 1.2;    // زيادة حدة الصوت للمساعدة في إعطاء طابع أنثوي
            
            const voices = window.speechSynthesis.getVoices();
            // تصفية الأصوات العربية
            const arVoices = voices.filter(v => v.lang.startsWith('ar'));
            
            if (arVoices.length > 0) {
                // محاولة البحث عن صوت أنثوي من خلال الاسم
                const femaleVoice = arVoices.find(v => 
                    v.name.toLowerCase().includes('female') || 
                    v.name.toLowerCase().includes('zaira') || 
                    v.name.toLowerCase().includes('laila') || 
                    v.name.toLowerCase().includes('zeina') || 
                    v.name.toLowerCase().includes('salma') || 
                    v.name.toLowerCase().includes('mariam') || 
                    v.name.toLowerCase().includes('safa') || 
                    v.name.toLowerCase().includes('hoda') || 
                    v.name.toLowerCase().includes('woman')
                );

                // إذا وجدنا صوت أنثوي نختاره، وإلا نختار أول صوت عربي متاح
                utterance.voice = femaleVoice ? femaleVoice : arVoices[0];
            }
            
            window.speechSynthesis.speak(utterance);
        }

        // لضمان تحميل الأصوات بشكل صحيح في بعض المتصفحات
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        // خلط المصفوفة
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // بدء اللعبة من شاشة البداية
        function startGame() {
            speakText('هَيَّا نَلْعَب'); // نطق البداية
            
            startScreen.classList.add('hidden');
            startScreen.classList.remove('flex');
            gameContainer.classList.remove('hidden');
            gameContainer.classList.add('flex');
            
            currentQuestionIndex = 0;
            
            // نؤخر تحميل السؤال الأول قليلاً حتى ينتهي نطق جملة البداية
            setTimeout(loadQuestion, 1500); 
        }

        // إعادة اللعب بعد الانتهاء
        function resetToFirst() {
            endScreen.classList.add('hidden');
            endScreen.classList.remove('flex');
            gameContainer.classList.remove('hidden');
            gameContainer.classList.add('flex');
            
            currentQuestionIndex = 0;
            loadQuestion();
        }

        // تحميل سؤال
        function loadQuestion() {
            isAnswered = false;
            optionsContainer.innerHTML = '';
            
            feedbackMsg.style.opacity = '0';
            feedbackMsg.textContent = '';
            feedbackMsg.className = 'text-4xl md:text-5xl font-black mb-6 opacity-0 transition-opacity duration-300 drop-shadow-md';
            nextBtn.classList.add('hidden');

            const currentData = gameData[currentQuestionIndex];
            
            // تحديث الكلمة في السؤال
            targetWordElement.textContent = currentData.word;
            
            // نطق السؤال باستخدام النص المُشكل المخصص
            speakText(currentData.spoken);

            // تجهيز البطاقات
            let options = [
                { emoji: currentData.correct, isCorrect: true },
                { emoji: currentData.distractors[0], isCorrect: false },
                { emoji: currentData.distractors[1], isCorrect: false }
            ];
            options = shuffleArray(options);

            options.forEach((opt, index) => {
                const card = document.createElement('div');
                card.className = 'emoji-card pop-in border-gray-100';
                card.style.animationDelay = `${index * 0.15}s`;
                card.textContent = opt.emoji;
                
                card.onclick = () => handleOptionClick(card, opt.isCorrect);
                
                optionsContainer.appendChild(card);
            });
        }

        // زر إعادة الاستماع
        function replayAudio() {
            if(!isAnswered) {
                const currentData = gameData[currentQuestionIndex];
                speakText(currentData.spoken);
            }
        }

        // النقر على خيار
        function handleOptionClick(cardElement, isCorrect) {
            if (isAnswered) return;

            // إزالة الاهتزاز السابق
            document.querySelectorAll('.emoji-card').forEach(c => c.classList.remove('shake-animation'));

            if (isCorrect) {
                isAnswered = true;
                
                // الصوت الصحيح
                speakText('أَحْسَنْت! إِجَابَة صَحِيحَة');
                
                cardElement.classList.add('correct-animation');
                cardElement.style.pointerEvents = 'none';
                
                feedbackMsg.textContent = 'أحسنت! إجابة صحيحة ⭐';
                feedbackMsg.classList.add('text-green-500');
                feedbackMsg.classList.remove('text-red-500');
                feedbackMsg.style.opacity = '1';
                
                nextBtn.classList.remove('hidden');
                
                createStarExplosion(cardElement);

                // تبهيت الخيارات الخاطئة
                Array.from(optionsContainer.children).forEach(child => {
                    if (child !== cardElement) {
                        child.style.opacity = '0.4';
                        child.style.transform = 'scale(0.9)';
                        child.style.pointerEvents = 'none';
                    }
                });

            } else {
                // الصوت الخاطئ
                speakText('حَاوِلْ مَرَّةً أُخْرَى');
                
                void cardElement.offsetWidth; // إعادة تهيئة الحركة
                cardElement.classList.add('shake-animation');
                
                feedbackMsg.textContent = 'حاول مرة أخرى!';
                feedbackMsg.classList.add('text-happyPink');
                feedbackMsg.classList.remove('text-green-500');
                feedbackMsg.style.opacity = '1';
            }
        }

        // الانتقال للسؤال التالي
        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < gameData.length) {
                loadQuestion();
            } else {
                showEndScreen();
            }
        }

        // شاشة النهاية
        function showEndScreen() {
            gameContainer.classList.add('hidden');
            gameContainer.classList.remove('flex');
            endScreen.classList.remove('hidden');
            endScreen.classList.add('flex');
            
            speakText('عَمَل رَائِع ! أَنْتَ بَطَل حَرْف الحَاء');
            createStarExplosion(document.body, 40);
        }

        // تأثير النجوم
        function createStarExplosion(element, count = 12) {
            const rect = element.getBoundingClientRect();
            const centerX = rect.left + (rect.width / 2);
            const centerY = rect.top + (rect.height / 2);
            const emojis = ['⭐', '✨', '🌟', '🎉'];

            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                
                star.style.left = `${centerX}px`;
                star.style.top = `${centerY}px`;
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = 80 + Math.random() * 150;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity - 200; // الاتجاه للأعلى دائماً
                
                star.style.animation = `flyStar${i} 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards`;
                
                const styleSheet = document.styleSheets[0];
                const keyframes = `
                    @keyframes flyStar${i} {
                        0% { transform: translate(-50%, -50%) scale(0.2) rotate(0deg); opacity: 1; }
                        100% { transform: translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(${1 + Math.random()}) rotate(${Math.random()*720}deg); opacity: 0; }
                    }
                `;
                
                try {
                    styleSheet.insertRule(keyframes, styleSheet.cssRules.length);
                } catch(e) {}

                document.body.appendChild(star);

                setTimeout(() => {
                    star.remove();
                }, 1500);
            }
        }
    </script>
</body>
</html>
